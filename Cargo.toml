[package]
name = "instagent"
version = "0.1.0"
edition = "2021"
description = "插件为核心的最小 agent（Rust 从零实现）"
# 发布元数据与 toolchain/MSRV 政策见 docs/release.md（plan E1/E2）。
# license 对齐只读参考基线 block/goose（Apache-2.0，搬运片段在 commit 注明出处）。
license = "Apache-2.0"
repository = "https://github.com/zhy0216/instagent"
homepage = "https://github.com/zhy0216/instagent"
documentation = "https://github.com/zhy0216/instagent/tree/main/docs"
# MSRV：1.93 为经验证的最低支持版本（`cargo +1.93.1 check --all-targets` 通过，
# 2026-09-05）；CI/本地固定 toolchain 见 rust-toolchain.toml。
rust-version = "1.93"
keywords = ["agent", "llm", "cli", "plugins", "ai"]
categories = ["command-line-utilities", "development-tools"]
# 18：fixture bin（mcp-fixture-server / fake-proxy-server）加入后 `cargo run`
# 有歧义；验收命令 `cargo run -- --help` 需要默认 bin 指向主 CLI。
default-run = "instagent"

# 依赖清单在 todos/00 一次性锁定，后续任务不加依赖、不升级依赖。
# 版本基准：第二版 §3 + 第三版 §4；rmcp 版本取 goose 根 Cargo.toml workspace 值（4ad43df）。
# todo 14 测试 fixture：最小 stdio MCP server（rmcp server 侧），由
# src/tools/mcp.rs 的测试经 CARGO_BIN_EXE_mcp-fixture-server 启动。
# 仅新增 target 声明，不改依赖清单（AGENTS.md 由 00 锁定的部分不变）。
[[bin]]
name = "mcp-fixture-server"
path = "tests/fixtures/mcp_stdio_server.rs"
test = false
doctest = false

# todo 11 测试 fixture：假 openai 兼容 proxy server（仅 std，形态同 mcp
# fixture 的 bin 先例），由 tests/provider_proxy.rs 的测试经
# CARGO_BIN_EXE_fake-proxy-server 启动。仍只加 target，不加依赖。
[[bin]]
name = "fake-proxy-server"
path = "tests/fixtures/fake_proxy_server.rs"
test = false
doctest = false

[profile.release]
strip = "symbols"
lto = "thin"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
futures = "0.3"
ignore = "0.4"
include_dir = "0.7"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "3.0.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    # 14 的 StreamableHttpClientTransport::from_uri 需要 reqwest 实现（rmcp 3.x 拆出的子 feature）
    "transport-streamable-http-client-reqwest",
] }
rustyline = "18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shellexpand = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
# 只用 CancellationToken，默认 feature 即可（原 "full" 是多余的）。
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
