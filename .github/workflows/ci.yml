name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # todo 12 已合并：anthropic 原生 engine 走独立 feature，两步全量校验。
      - run: cargo clippy --all-targets --features anthropic-engine -- -D warnings
      - run: cargo test --features anthropic-engine
